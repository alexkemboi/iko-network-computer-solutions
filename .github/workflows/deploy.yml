name: Deploy IKO Network Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 30s
          command_timeout: 20m
          script: |
            set -e

            echo "Starting deployment..."

            cd ~/ikonexsystemswebsites/iko-network-computer-solutions

            echo "Pulling latest code..."
            # Match GitHub exactly; a plain pull aborts when npm has rewritten
            # package-lock.json on the server. server/.env is git-ignored, so it stays.
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building application..."
            npm run build

            echo "Deploying build..."
            sudo rm -rf /var/www/ikonexsystems/*

            sudo cp -r build/* /var/www/ikonexsystems/

            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            echo "Deployment completed successfully."

             pm2 restart ikonex-api --update-env || true
